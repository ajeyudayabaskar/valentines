<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Devi ❤️</title>

<style>
* {
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffb3c6, #ffc8dd);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
}

/* MAIN CARD */
.container {
    background: linear-gradient(135deg, #ffe6eb, #fff0f5);
    padding: 40px;
    border-radius: 24px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    position: relative;
    z-index: 2;
}

.container img.main {
    width: 220px;
    border-radius: 18px;
    margin-bottom: 20px;
}

h1 {
    color: #d6336c;
    margin-bottom: 25px;
}

.buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
}

/* BUTTONS */
button {
    padding: 12px 30px;
    font-size: 16px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.3s ease;
}

#yesBtn {
    background: #ff4d6d;
    color: white;
}

#yesBtn:hover {
    transform: scale(1.1);
    background: #ff2e55;
}

#noBtn {
    background: #adb5bd;
    color: #333;
    position: relative;
}

/* Wiggle */
.wiggle {
    animation: wiggle 0.3s ease;
}

@keyframes wiggle {
    0% { transform: rotate(0); }
    25% { transform: rotate(-4deg); }
    50% { transform: rotate(4deg); }
    75% { transform: rotate(-3deg); }
    100% { transform: rotate(0); }
}

/* ---------- CORNER DECORATIONS ---------- */
.corner {
    position: fixed;
    z-index: 1;
    pointer-events: none;
}

/* Drop animation */
.top {
    top: -220px;
    animation: dropIn 1.2s ease forwards;
}

@keyframes dropIn {
    to { top: 0; }
}

/* TOP LEFT – BIGGER */
.top.left {
    left: 0;
    width: 300px;
}

/* TOP RIGHT – HIGHER */
.top.right {
    right: 0;
    top: -260px;
    width: 200px;
}

/* BOTTOM LEFT – MOVED RIGHT */
.bottom.left {
    bottom: 0;
    left: 40px;
    width: 170px;
}

/* BOTTOM RIGHT – BIGGER */
.bottom.right {
    bottom: 0;
    right: 0;
    width: 180px;
}
</style>
</head>

<body>

<!-- DECORATIONS -->
<img src="top-left.png" class="corner top left" alt="">
<img src="top-right.png" class="corner top right" alt="">
<img src="bottom-left.png" class="corner bottom left" alt="">
<img src="bottom-right.png" class="corner bottom right" alt="">

<!-- MAIN CONTENT -->
<div class="container">
    <img src="image.png" class="main" alt="Devi ❤️">

    <h1>Devi, will you be my Valentine? 💖</h1>

    <div class="buttons">
        <button id="yesBtn" onclick="window.location.href='yes.html'">
            Yes 💘
        </button>

        <button id="noBtn">
            No 😢
        </button>
    </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");

const texts = [
    "Are you sure? 😳",
    "Think again 🤔",
    "Please no 😢",
    "You sure sure? 💔",
    "Devi pls 😭",
    "This hurts 🥺",
    "Still no? 😵",
    "Last chance 😐",
    "Okay click me 😞"
];

let attempts = 0;
let activated = false;
let converted = false;

noBtn.addEventListener("mouseenter", () => {

    if (converted) return;

    if (!activated) {
        activated = true;
        noBtn.style.position = "fixed";
    }

    if (attempts >= texts.length) {
        // FINAL TRANSFORMATION
        converted = true;
        noBtn.textContent = "Caught ya… I was an YES all along 😘";
        noBtn.style.background = "#ff4d6d";
        noBtn.style.color = "white";
        noBtn.style.left = "50%";
        noBtn.style.top = "65%";
        noBtn.style.transform = "translate(-50%, -50%) scale(1.1)";
        noBtn.onclick = () => window.location.href = "yes.html";
        return;
    }

    const padding = 20;
    const maxX = window.innerWidth - noBtn.offsetWidth - padding;
    const maxY = window.innerHeight - noBtn.offsetHeight - padding;

    noBtn.style.left = Math.random() * maxX + "px";
    noBtn.style.top = Math.random() * maxY + "px";

    noBtn.textContent = texts[attempts];
    attempts++;

    noBtn.classList.add("wiggle");
    setTimeout(() => noBtn.classList.remove("wiggle"), 300);
});
</script>

</body>
</html>
