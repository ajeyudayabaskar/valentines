<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Just One Thing… 💭</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(
        135deg,
        #ff9eb5,
        #ffb3c6,
        #ffc8dd,
        #ffd1dc,
        #ffe0e8
    );
    background-size: 400% 400%;
    animation: bgPulse 20s ease infinite;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
}

@keyframes bgPulse {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.wrapper {
    background: linear-gradient(135deg, rgba(255, 214, 224, 0.95), rgba(255, 230, 235, 0.95));
    padding: 50px 40px;
    border-radius: 26px;
    text-align: center;
    max-width: 480px;
    width: 90%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25), 
                0 10px 25px rgba(0,0,0,0.15),
                inset 0 -3px 10px rgba(0, 0, 0, 0.1);
    backdrop-filter: blur(10px);
    animation: fadeUp 1.2s ease forwards;
    position: relative;
    z-index: 2;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.wrapper:hover {
    transform: translateY(-5px) scale(1.02);
    box-shadow: 0 25px 60px rgba(255, 107, 157, 0.3), 
                0 15px 35px rgba(0,0,0,0.2),
                inset 0 -3px 10px rgba(0, 0, 0, 0.1);
}

h1 {
    color: #c9184a;
    font-size: 2.2rem;
    margin-bottom: 25px;
    font-family: 'Pacifico', cursive;
    animation: pulse 2.5s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
}

.gradient-text {
    background: linear-gradient(135deg, #ff6b9d, #c9184a, #ff4d6d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    display: inline-block;
    padding: 0 2px;
}

p {
    color: #6a040f;
    font-size: 1.15rem;
    line-height: 1.7;
    margin-bottom: 35px;
}

/* Enhanced Button with 3D effects */
button {
    background: linear-gradient(135deg, #ff4d6d, #ff6b81);
    color: white;
    font-size: 18px;
    padding: 16px 40px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(255, 77, 109, 0.4), 
                0 4px 10px rgba(255, 107, 129, 0.3),
                inset 0 -3px 0 rgba(0, 0, 0, 0.2);
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: left 0.5s ease;
}

button:hover::before {
    left: 100%;
}

button:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 30px rgba(255, 77, 109, 0.5), 
                0 6px 15px rgba(255, 107, 129, 0.4),
                inset 0 -3px 0 rgba(0, 0, 0, 0.2),
                0 0 20px rgba(255, 77, 109, 0.3);
}

button:active {
    transform: translateY(-1px) scale(1.02);
    box-shadow: 0 6px 15px rgba(255, 77, 109, 0.4), 
                0 3px 8px rgba(255, 107, 129, 0.3),
                inset 0 -2px 0 rgba(0, 0, 0, 0.2);
}

/* Floating hearts */
.heart {
    position: fixed;
    bottom: -20px;
    font-size: 22px;
    opacity: 0.8;
    animation: floatUp 7s linear infinite;
    pointer-events: none;
}

@keyframes floatUp {
    to {
        transform: translateY(-120vh) rotate(360deg);
        opacity: 0;
    }
}

/* Entrance animation */
@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* Sparkle effect */
.sparkle {
    position: fixed;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
    pointer-events: none;
    animation: sparkleFloat 3s ease-out forwards;
}

@keyframes sparkleFloat {
    0% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
    100% {
        opacity: 0;
        transform: translateY(-100px) scale(0);
    }
}

/* MOBILE RESPONSIVE */
@media (max-width: 768px) {
    .wrapper {
        padding: 40px 30px;
        max-width: 90%;
    }

    .wrapper:hover {
        transform: none;
        box-shadow: 0 20px 50px rgba(0,0,0,0.25), 
                    0 10px 25px rgba(0,0,0,0.15),
                    inset 0 -3px 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
        font-size: 1.8rem;
        margin-bottom: 20px;
    }

    p {
        font-size: 1.05rem;
        margin-bottom: 30px;
    }

    button {
        padding: 14px 35px;
        font-size: 17px;
    }
}

@media (max-width: 480px) {
    .wrapper {
        padding: 35px 25px;
    }

    h1 {
        font-size: 1.5rem;
    }

    p {
        font-size: 1rem;
        margin-bottom: 25px;
    }

    button {
        padding: 13px 30px;
        font-size: 16px;
    }
}
</style>
</head>
<body>

<div class="wrapper">
    <h1><span class="gradient-text">Hey Devi</span>… 💭</h1>
    <p>
        I've been wanting to ask you something.<br>
        Something that's been on my mind for a while.
    </p>
    <button onclick="goNext()">Okay… go on 💕</button>
</div>

<script>
/* Floating hearts with variation */
setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    const hearts = ['💖', '💕', '💗', '💓'];
    heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (18 + Math.random() * 12) + "px";
    heart.style.animationDuration = (6 + Math.random() * 2) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 8000);
}, 800);

/* Sparkle effect on mouse move */
let lastSparkle = 0;
document.addEventListener('mousemove', (e) => {
    const now = Date.now();
    if (now - lastSparkle > 100) {
        lastSparkle = now;
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        sparkle.style.left = e.clientX + 'px';
        sparkle.style.top = e.clientY + 'px';
        document.body.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 3000);
    }
});

/* Touch support for sparkles on mobile */
document.addEventListener('touchmove', (e) => {
    const now = Date.now();
    if (now - lastSparkle > 100) {
        lastSparkle = now;
        const touch = e.touches[0];
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        sparkle.style.left = touch.clientX + 'px';
        sparkle.style.top = touch.clientY + 'px';
        document.body.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 3000);
    }
});

/* Navigation function */
function goNext() {
    // Add fade out animation
    document.querySelector('.wrapper').style.animation = 'fadeUp 0.5s ease reverse';
    setTimeout(() => {
        window.location.href = "question.html";
    }, 400);
}

/* Touch support for button */
document.querySelector('button').addEventListener('touchend', (e) => {
    e.preventDefault();
    goNext();
});
</script>

</body>
</html>
