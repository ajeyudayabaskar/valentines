<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Will You Be My Valentine 💘</title>

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        text-align: center;
    }

    .container {
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(10px);
        padding: 40px 50px;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        z-index: 5;
    }

    h1 {
        font-size: 2.2em;
        color: #b30059;
        margin-bottom: 20px;
    }

    img.main {
        width: 260px;
        border-radius: 15px;
        margin-bottom: 25px;
    }

    .buttons {
        display: flex;
        justify-content: center;
        gap: 20px;
        position: relative;
    }

    button {
        font-size: 1.1em;
        padding: 12px 28px;
        border-radius: 30px;
        border: none;
        cursor: pointer;
        transition: transform 0.2s ease;
    }

    #yesBtn {
        background: #ff4d6d;
        color: white;
    }

    #noBtn {
        background: #f1f1f1;
        color: #333;
        position: relative; /* important: natural position on load */
    }

    /* Wiggle */
    .wiggle {
        animation: wiggle 0.35s ease;
    }

    @keyframes wiggle {
        0% { transform: rotate(0deg); }
        25% { transform: rotate(-5deg); }
        50% { transform: rotate(5deg); }
        75% { transform: rotate(-3deg); }
        100% { transform: rotate(0deg); }
    }

    /* ==========================
       CORNER DECORATIONS
    ========================== */

    .corner {
        position: fixed;
        z-index: 1;
        pointer-events: none;
    }

    /* Top decorations slide in */
    .top {
        top: -120px;
        animation: dropIn 1.2s ease forwards;
    }

    @keyframes dropIn {
        to { top: 0; }
    }

    .top.left {
        left: 0;
        width: 140px;
    }

    .top.right {
        right: 0;
        width: 140px;
    }

    .bottom.left {
        bottom: 0;
        left: 0;
        width: 140px;
    }

    .bottom.right {
        bottom: 0;
        right: 0;
        width: 140px;
    }

</style>
</head>

<body>

<!-- Corner Decorations -->
<img src="top-left.png" class="corner top left" alt="">
<img src="top-right.jpg" class="corner top right" alt="">
<img src="cupid.png" class="corner bottom left" alt="">
<img src="calendar.png" class="corner bottom right" alt="">

<div class="container">
    <h1>Will you be my Valentine? 💖</h1>

    <img src="image.jpg" class="main" alt="Devi ❤️">

    <div class="buttons">
        <button id="yesBtn" onclick="goYes()">Yes 💘</button>
        <button id="noBtn">No 🙈</button>
    </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");

const texts = [
    "Are you sure? 😳",
    "Think again 🤔",
    "Please no 😢",
    "You sure sure? 💔",
    "Devi pls 😭",
    "This hurts 🥺",
    "Still no? 😵",
    "Last chance 😐",
    "Okay click me 😞"
];

let index = 0;
let activated = false; // 👈 prevents movement on load

noBtn.addEventListener("mouseenter", () => {
    if (!activated) activated = true;

    const maxX = window.innerWidth - noBtn.offsetWidth - 20;
    const maxY = window.innerHeight - noBtn.offsetHeight - 20;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.position = "fixed";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    noBtn.textContent = texts[index % texts.length];
    index++;

    noBtn.classList.add("wiggle");
    setTimeout(() => noBtn.classList.remove("wiggle"), 300);
});

function goYes() {
    window.location.href = "yes.html";
}
</script>

</body>
</html>
