<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Devi ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Pacifico&family=Great+Vibes&family=Satisfy&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffb3c6, #ffc8dd);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
}

/* MAIN CARD */
.container {
    background: linear-gradient(135deg, #ffd6e0, #ffe6eb);
    padding: 42px;
    border-radius: 26px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.18);
    position: relative;
    z-index: 2;
    backdrop-filter: blur(10px);
    background: linear-gradient(135deg, rgba(255, 214, 224, 0.95), rgba(255, 230, 235, 0.95));
}

.container img.main {
    width: 220px;
    border-radius: 18px;
    margin-bottom: 20px;
}

h1 {
    color: #d6336c;
    margin-bottom: 25px;
    font-family: 'Pacifico', cursive;
    font-size: 2rem;
}

.buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
}

/* BUTTONS */
button {
    padding: 12px 30px;
    font-size: 16px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.25s ease;
}

#yesBtn {
    background: #ff4d6d;
    color: white;
}

#yesBtn:hover {
    transform: scale(1.1);
}

#noBtn {
    background: #adb5bd;
    color: #333;
    position: relative;
}

/* Wiggle */
@keyframes wiggle {
    0% { transform: translate(-50%, -50%) rotate(0); }
    25% { transform: translate(-50%, -50%) rotate(-4deg); }
    50% { transform: translate(-50%, -50%) rotate(4deg); }
    75% { transform: translate(-50%, -50%) rotate(-3deg); }
    100% { transform: translate(-50%, -50%) rotate(0); }
}

.wiggle {
    animation: wiggle 0.3s ease;
}

/* ---------- CORNER DECORATIONS ---------- */
.corner {
    position: fixed;
    pointer-events: none;
    z-index: 1;
    animation: floatIdle 8s ease-in-out infinite;
}

/* Gentle idle motion */
@keyframes floatIdle {
    0% { transform: translateY(0); }
    50% { transform: translateY(6px); }
    100% { transform: translateY(0); }
}

/* Entrance animations */
.top {
    top: -260px;
    animation: dropIn 1.2s ease forwards, floatIdle 8s ease-in-out infinite;
}

.bottom {
    opacity: 0;
    animation: riseIn 1.4s ease forwards, floatIdle 9s ease-in-out infinite;
    animation-delay: 0.8s;
}

@keyframes dropIn {
    to { top: 0; }
}

@keyframes riseIn {
    to {
        opacity: 1;
        transform: translateY(-10px);
    }
}

/* Positions */
.top.left {
    left: 0;
    width: 200px;
}

.top.right {
    right: 0;
    width: 200px;
}

.bottom.left {
    bottom: 0;
    left: 40px;
    width: 180px;
}

.bottom.right {
    bottom: 0;
    right: 0;
    width: 190px;
}

/* Floating hearts */
.heart {
    position: fixed;
    bottom: -20px;
    font-size: 20px;
    animation: floatUp 6s linear forwards;
    opacity: 0.8;
    pointer-events: none;
}

@keyframes floatUp {
    to {
        transform: translateY(-110vh);
        opacity: 0;
    }
}

/* Particle burst */
.particle {
    position: fixed;
    pointer-events: none;
    font-size: 20px;
    animation: burstOut 0.8s ease-out forwards;
}

@keyframes burstOut {
    0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
    }
    100% {
        transform: translate(var(--tx), var(--ty)) scale(0);
        opacity: 0;
    }
}

/* Confetti */
.confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    background: var(--color);
    top: -10px;
    animation: confettiFall 3s ease-out forwards;
    opacity: 1;
}

@keyframes confettiFall {
    to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<!-- CORNER IMAGES -->
<img src="top-left.png" class="corner top left">
<img src="top-right.png" class="corner top right">
<img src="bottom-left.png" class="corner bottom left">
<img src="bottom-right.png" class="corner bottom right">

<!-- MAIN CONTENT -->
<div class="container">
    <img src="image.png" class="main" alt="Devi ❤️">
    <h1>Devi, will you be my Valentine? 💖</h1>

    <div class="buttons">
        <button id="yesBtn" onclick="location.href='yes.html'">
            Yes 💘
        </button>
        <button id="noBtn">No 😢</button>
    </div>
</div>

<script>
/* Floating hearts restore */
setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (16 + Math.random() * 10) + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}, 700);

/* NO BUTTON LOGIC */
const noBtn = document.getElementById("noBtn");

const texts = [
    "Are you sure? 😳",
    "Think again 🤔",
    "Please no 😢",
    "You sure sure? 💔",
    "Devi pls 😭",
    "This hurts 🥺",
    "Still no? 😵",
    "Last chance 😐",
    "Okay click me 😞"
];

let attempts = 0;
let movable = false;
let readyToConvert = false;

noBtn.addEventListener("mouseenter", () => {
    if (!movable) {
        movable = true;
        noBtn.style.position = "fixed";
    }

    if (readyToConvert) return;

    if (attempts < texts.length) {
        noBtn.textContent = texts[attempts];
        attempts++;

        // Use percentage-based positioning for safer boundaries
        // Keep button within 10% to 80% of viewport width/height
        const minPercent = 10;
        const maxPercent = 80;
        
        const randomX = minPercent + Math.random() * (maxPercent - minPercent);
        const randomY = minPercent + Math.random() * (maxPercent - minPercent);

        noBtn.style.left = randomX + "%";
        noBtn.style.top = randomY + "%";
        noBtn.style.transform = "translate(-50%, -50%)"; // Center the button on the position

        noBtn.classList.add("wiggle");
        setTimeout(() => noBtn.classList.remove("wiggle"), 300);

        if (attempts === texts.length) {
            readyToConvert = true;
        }
    }
});

/* Convert ONLY on click after "Okay click me" */
noBtn.addEventListener("click", () => {
    if (!readyToConvert) return;

    // Create particle burst effect
    createParticleBurst(noBtn);

    noBtn.textContent = "Caught ya… I was an YES all along 😘";
    noBtn.style.background = "#ff4d6d";
    noBtn.style.color = "white";
    // Button stays where it is - no repositioning
    
    // Create confetti explosion
    createConfetti();
    
    // Redirect after 1 second delay
    setTimeout(() => {
        location.href = "yes.html";
    }, 1000);
});

/* Particle burst effect */
function createParticleBurst(element) {
    const rect = element.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    
    const particles = ['💖', '💕', '💗', '💓', '💝', '✨', '⭐'];
    const count = 12;
    
    for (let i = 0; i < count; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.textContent = particles[Math.floor(Math.random() * particles.length)];
        particle.style.left = centerX + 'px';
        particle.style.top = centerY + 'px';
        
        const angle = (i / count) * Math.PI * 2;
        const distance = 100 + Math.random() * 50;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;
        
        particle.style.setProperty('--tx', tx + 'px');
        particle.style.setProperty('--ty', ty + 'px');
        
        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), 800);
    }
}

/* Confetti explosion */
function createConfetti() {
    const colors = ['#ff6b9d', '#c06c84', '#f67280', '#ffd6e0', '#ff4d6d', '#ffb3c6'];
    const count = 50;
    
    for (let i = 0; i < count; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.setProperty('--color', colors[Math.floor(Math.random() * colors.length)]);
        confetti.style.animationDelay = Math.random() * 0.3 + 's';
        confetti.style.animationDuration = (2 + Math.random() * 1) + 's';
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 3000);
    }
}
</script>

</body>
</html>
